name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно выполняется только один деплой; лишние сборки в очереди отменяются
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Статическая SPA-сборка под /hotshot-play/ с демо-клубами для витрины
      - run: bun run build:static
        env:
          VITE_BASE: /hotshot-play/
          VITE_DEMO_CLUBS: "1"

      # GitHub Pages отдаёт 404.html для неизвестных путей — копия index.html
      # позволяет открывать /clubs/... и /profile напрямую
      - run: |
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
